<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Max</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #080808;
      color: white;
    }

    /* NAVBAR */
    nav {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
      background: #0d0d0d;
      border-bottom: 1px solid #222;
    }

    .logo {
      font-size: 27px;
      font-weight: bold;
      color: #ff1744;
    }

    nav a {
      color: #ddd;
      text-decoration: none;
      margin-left: 25px;
    }

    nav a:hover {
      color: #ff1744;
    }

    /* HERO */
    .hero {
      min-height: 500px;
      padding: 100px 7%;
      display: flex;
      align-items: center;
      background:
        linear-gradient(90deg, #080808 15%, rgba(8,8,8,.75), rgba(8,8,8,.15)),
        linear-gradient(0deg, #080808, transparent),
        url("https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=1600&q=80")
        center/cover;
    }

    .hero-content {
      max-width: 600px;
    }

    .hero h1 {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .hero p {
      color: #ccc;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .watch-btn {
      background: #ff1744;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    .watch-btn:hover {
      background: #d50035;
    }

    /* SEARCH */
    .search {
      padding: 30px 7%;
      text-align: center;
    }

    .search input {
      width: 90%;
      max-width: 600px;
      padding: 15px 20px;
      border-radius: 30px;
      border: 1px solid #333;
      background: #151515;
      color: white;
      outline: none;
    }

    /* SECTIONS */
    section {
      padding: 20px 7% 40px;
    }

    section h2 {
      margin-bottom: 20px;
      font-size: 25px;
    }

    .anime-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 20px;
    }

    .anime-card {
      background: #151515;
      border-radius: 10px;
      overflow: hidden;
      transition: .3s;
      cursor: pointer;
    }

    .anime-card:hover {
      transform: translateY(-7px);
    }

    .anime-card img {
      width: 100%;
      height: 230px;
      object-fit: cover;
    }

    .anime-card h3 {
      padding: 12px;
      font-size: 16px;
    }

    .anime-card p {
      padding: 0 12px 14px;
      color: #999;
      font-size: 13px;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #777;
      border-top: 1px solid #222;
    }

    /* MOBILE */
    @media (max-width: 600px) {
      nav {
        padding: 0 20px;
      }

      nav a {
        margin-left: 10px;
        font-size: 13px;
      }

      .hero {
        min-height: 430px;
        padding: 60px 25px;
      }

      .hero h1
