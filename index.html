<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Anime Max</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#000;color:#fff}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:#111;position:sticky;top:0}
.logo{font-size:30px;font-weight:bold;color:#ff003c}
.hero{height:320px;padding:20px;display:flex;align-items:flex-end;background:linear-gradient(to top,#000,transparent),linear-gradient(135deg,#5b21b6,#e11d48)}
.hero h1{font-size:42px}.hero p{margin:8px 0;color:#ddd}
.btn{background:#ff003c;color:#fff;padding:12px 22px;border-radius:8px;text-decoration:none;font-weight:bold;display:inline-block}
.search{padding:15px}.search input{width:100%;padding:13px;border:none;border-radius:30px;background:#1a1a1a;color:#fff}
section{padding:18px}h2{margin-bottom:12px}.row{display:flex;overflow:auto;gap:12px}.card{min-width:145px;background:#161616;border-radius:12px;overflow:hidden}.poster{height:200px;background:linear-gradient(180deg,#ff003c,#5b21b6)}.title{padding:10px;text-align:center;font-size:14px}
footer{text-align:center;color:#777;padding:20px}
</style>
</head>
<body>
<header><div class="logo">ANIME MAX</div><div>🔔</div></header>
<div class="hero"><div><h1>Solo Leveling</h1><p>Season 2 • Action • Fantasy</p><a href="#" class="btn">▶ Watch Now</a></div></div>
<div class="search"><input placeholder="🔍 Search Anime"></div>
<section><h2>🔥 Trending</h2><div class="row"><div class="card"><div class="poster"></div><div class="title">Naruto</div></div><div class="card"><div class="poster"></div><div class="title">One Piece</div></div><div class="card"><div class="poster"></div><div class="title">JJK</div></div><div class="card"><div class="poster"></div><div class="title">Demon Slayer</div></div></div></section>
<section><h2>⭐ Popular</h2><div class="row"><div class="card"><div class="poster"></div><div class="title">Blue Lock</div></div><div class="card"><div class="poster"></div><div class="title">Chainsaw Man</div></div><div class="card"><div class="poster"></div><div class="title">Attack on Titan</div></div></div></section>
<footer>© 2026 Anime Max</footer>
</body>
</html>
